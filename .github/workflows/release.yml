name: Release

# A release is a tag: `git tag v0.1.0 && git push origin v0.1.0` builds a
# signed APK and attaches it to a GitHub pre-release. The version name is
# the tag, the version code the run number, so nothing in the tree bumps.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Decode the signing key
        run: echo "$HOMEOSTAT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        env:
          HOMEOSTAT_KEYSTORE_BASE64: ${{ secrets.HOMEOSTAT_KEYSTORE_BASE64 }}
      - name: Build
        run: ./gradlew test lint assembleRelease
        env:
          HOMEOSTAT_VERSION_NAME: ${{ github.ref_name }}
          HOMEOSTAT_VERSION_CODE: ${{ github.run_number }}
          HOMEOSTAT_KEYSTORE: ${{ runner.temp }}/release.jks
          HOMEOSTAT_KEYSTORE_PASSWORD: ${{ secrets.HOMEOSTAT_KEYSTORE_PASSWORD }}
          HOMEOSTAT_KEY_ALIAS: ${{ secrets.HOMEOSTAT_KEY_ALIAS }}
      - name: Publish the pre-release
        run: |
          cp app/build/outputs/apk/release/app-release.apk "homeostat-${{ github.ref_name }}.apk"
          gh release create "${{ github.ref_name }}" --prerelease --generate-notes \
            --title "homeostat-app ${{ github.ref_name }}" "homeostat-${{ github.ref_name }}.apk"
        env:
          GH_TOKEN: ${{ github.token }}
